name: Build and Test-run

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++

          - os: ubuntu-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++

          - os: macos-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++

          - os: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B "${{ github.workspace }}/build" `
            "-DCMAKE_C_COMPILER=${{ matrix.c_compiler }}" `
            "-DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}" `
            "-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}" `
            -S "${{ github.workspace }}"

      - name: Build
        run: cmake --build "${{ github.workspace }}/build" --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir "${{ github.workspace }}/build" -C ${{ matrix.build_type }} --output-on-failure
